services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      GATEWAY_MOCK_LLM: "true"
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
    depends_on: [phoenix]

  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports: ["8501:8501"]
    environment:
      GATEWAY_API_URL: http://api:8000
    depends_on: [api]

  phoenix:
    image: arizephoenix/phoenix:latest
    ports: ["6006:6006"]
